# === PROPIEDADES COMUNES ===

spring.application.name=restaurant


# Base de datos
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Log Spring Security internal events
logging.level.org.springframework.security=DEBUG

# Log HTTP filter chain
logging.level.org.springframework.security.web=DEBUG

# Batching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false


# === PROPIEDADES PROPIAS DE LA APLICACIÓN ===

# Propiedades tokens
app.auth.refresh-token.cookie.name=refreshToken
app.auth.refresh-token.remember-me-duration-days=60
app.auth.refresh-token.default-duration-minutes=60

